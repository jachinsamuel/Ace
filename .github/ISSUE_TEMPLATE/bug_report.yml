name: 🐛 Bug Report
description: Report an issue or unexpected behavior in Ace
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report an issue! Please provide as much detail as possible to help us reproduce and fix it.
  - type: input
    id: version
    attributes:
      label: Ace Version
      description: Run `ace --version` to find your installed version.
      placeholder: "e.g. 0.7.4"
    validations:
      required: true
  - type: dropdown
    id: provider
    attributes:
      label: AI Model / Backend Provider
      description: Which AI provider were you using when the issue occurred?
      options:
        - Ollama (Local)
        - NVIDIA NIM (Cloud)
        - OpenAI
        - Anthropic
        - Google Gemini
        - Custom OpenAI-Compatible
        - None / Standard Git Pass-Through
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating System & Shell
      description: What OS and terminal shell are you running?
      placeholder: "e.g. Windows 11 (PowerShell 7) / macOS Sonoma (zsh) / Ubuntu 24.04 (bash)"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Describe the Bug
      description: A clear and concise description of what happened vs what you expected.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Exact commands executed leading up to the issue.
      placeholder: |
        1. Run 'ace stage ...'
        2. Run 'ace commit ...'
        3. See error
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Terminal Logs / Error Output
      description: Please paste the command output or traceback.
      render: shell
