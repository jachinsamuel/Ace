[project]
name = "ace-git-copilot"
version = "0.6.6"
description = "AI-powered Git copilot — talk to Git in plain English"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Jachin Samuel", email = "jachinsamuel007@gmail.com" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "typer[all]>=0.12",
    "click>=8.0",
    "rich>=13.0",
    "gitpython>=3.1",
    "langchain>=0.3",
    "langchain-nvidia-ai-endpoints>=0.3",
    "langchain-ollama>=0.3",
    "langchain-openai>=0.1.0",
    "langchain-anthropic>=0.1.0",
    "python-dotenv>=1.0",
    "toml>=0.10.2",
]

[project.urls]
Homepage = "https://github.com/jachinsamuel/Ace"
Documentation = "https://github.com/jachinsamuel/Ace#readme"
Bug-Tracker = "https://github.com/jachinsamuel/Ace/issues"

[project.scripts]
ace = "ace.cli:app"

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "ruff>=0.15"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ace"]

[tool.ruff]
exclude = [".agents", "scratch"]

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["E402", "F401", "E501"]
